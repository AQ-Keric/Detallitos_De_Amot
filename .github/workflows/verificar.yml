name: Verificar app y generar APK
on:
  push:
    branches: [mejoras-app-personal]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas y compilación Android
        run: bash gradlew :composeApp:jvmTest :composeApp:testDebugUnitTest :composeApp:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Detallitos-Android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-pruebas
          path: composeApp/build/reports/tests/
